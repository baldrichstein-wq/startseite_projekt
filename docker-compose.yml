version: '3.8'

services:
  # PostgreSQL Datenbank
  db:
    image: postgres:15-alpine
    container_name: portal_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword1234
      POSTGRES_DB: portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # Node.js Webanwendung (Projekt-Hub)
  app:
    build: .
    container_name: portal_app
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
      - DATABASE_URL=postgres://postgres:adminpassword1234@db:5432/portal
    depends_on:
      - db

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portal_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiZDgwYTZlYjFjYTk1ZjMwYzkwM2JiYmMzM2YwYmNjOTYiLCJ0IjoiNGYyODdiMTItYTMxZC00MWM0LWJlZjgtYTUwNjkxMTcwN2ZhIiwicyI6Ik1USTFaV1prTUdVdFl6UmpPUzAwWmprNUxXSXhOVFl0TVdSaE1HTTNNelZqTUdRdyJ9
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
