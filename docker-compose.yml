version: '3.8'

services:
  # PostgreSQL Datenbank
  db:
    image: postgres:15-alpine
    container_name: portal_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword1234
      POSTGRES_DB: portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Node.js Webanwendung (Projekt-Hub)
  app:
    build: .
    container_name: portal_app
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
      - DATABASE_URL=postgres://postgres:adminpassword1234@db:5432/portal
      - JWT_SECRET=mein-sicheres-projektwoche-secret-9876
    depends_on:
      - db

volumes:
  postgres_data:
