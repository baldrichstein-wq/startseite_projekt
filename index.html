<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projekt-Hub: Das zentrale Dashboard für alle Webanwendungen und Services der Projektwoche auf unserem NAS.">
    <title>Projekt-Hub | NAS-Portal</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-bg">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
    </div>

    <div class="container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="header-logo">
                <i class="bi bi-grid-3x3-gap-fill logo-icon"></i>
                <div class="header-title-wrapper">
                    <h1>Projekt-Hub</h1>
                    <p class="subtitle">Zentrales Anwendungsportal für die Projektwoche</p>
                </div>
            </div>
            
            <div class="header-controls">
                <div class="stats-panel" id="stats-panel">
                    <div class="stat-item">
                        <span class="stat-value" id="total-count">0</span>
                        <span class="stat-label">Projekte</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-value" id="online-count">0</span>
                        <span class="stat-label">Online</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Search & Control Panel -->
        <section class="controls-section">
            <div class="search-wrapper">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Projekt suchen..." autocomplete="off">
                <button id="clear-search" class="clear-btn" aria-label="Suche löschen">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <nav class="filter-wrapper" aria-label="Projektkategorien">
                <button class="filter-btn active" data-category="all" id="filter-all">Alle</button>
                <button class="filter-btn" data-category="Infrastruktur" id="filter-infra">Infrastruktur</button>
                <button class="filter-btn" data-category="Entwicklung" id="filter-dev">Entwicklung</button>
                <button class="filter-btn" data-category="Produktivität" id="filter-prod">Produktivität</button>
            </nav>
        </section>

        <!-- Main Projects Grid -->
        <main class="projects-container">
            <div class="projects-grid" id="projects-grid">
                <div class="loading-state" id="loading-state">
                    <div class="spinner"></div>
                    <p>Lade Projekte...</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-info">
                <span><i class="bi bi-hdd-network-fill"></i> NAS Server: Online</span>
                <span class="dot-separator">•</span>
                <span>Projektwoche 2026</span>
            </div>
        </footer>
    </div>

    <!-- Script File -->
    <script src="app.js"></script>
</body>
</html>
