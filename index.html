<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projekt-Hub: Das zentrale Dashboard für alle Webanwendungen und Services der Projektwoche auf unserem NAS.">
    <title>Projekt-Hub | NAS-Portal</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-bg">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
    </div>

    <div class="container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="header-logo">
                <i class="bi bi-grid-3x3-gap-fill logo-icon"></i>
                <div class="header-title-wrapper">
                    <h1>Projekt-Hub</h1>
                    <p class="subtitle">Zentrales Anwendungsportal für die Projektwoche</p>
                </div>
            </div>
            
            <div class="header-controls">
                <div class="stats-panel" id="stats-panel">
                    <div class="stat-item">
                        <span class="stat-value" id="total-count">0</span>
                        <span class="stat-label">Projekte</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-value" id="online-count">0</span>
                        <span class="stat-label">Online</span>
                    </div>
                </div>

                <div class="user-panel" id="user-panel">
                    <span class="username-badge" id="username-badge" style="display: none;"><i class="bi bi-person-fill"></i> <span id="user-display-name">Admin</span></span>
                    <button id="btn-login-trigger" class="login-btn"><i class="bi bi-box-arrow-in-right"></i> Login</button>
                    <button id="btn-logout" class="login-btn logout" style="display: none;"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </div>
            </div>
        </header>

        <!-- Search & Control Panel -->
        <section class="controls-section">
            <div class="search-wrapper">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Projekt suchen..." autocomplete="off">
                <button id="clear-search" class="clear-btn" aria-label="Suche löschen">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <nav class="filter-wrapper" aria-label="Projektkategorien">
                <button class="filter-btn active" data-category="all" id="filter-all">Alle</button>
                <button class="filter-btn" data-category="Infrastruktur" id="filter-infra">Infrastruktur</button>
                <button class="filter-btn" data-category="Entwicklung" id="filter-dev">Entwicklung</button>
                <button class="filter-btn" data-category="Produktivität" id="filter-prod">Produktivität</button>
            </nav>
        </section>

        <!-- Main Projects Grid -->
        <main class="projects-container">
            <div class="projects-grid" id="projects-grid">
                <!-- Cards get dynamically generated by app.js -->
                <div class="loading-state" id="loading-state">
                    <div class="spinner"></div>
                    <p>Lade Projekte...</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-info">
                <span><i class="bi bi-hdd-network-fill"></i> NAS Server: Online</span>
                <span class="dot-separator">•</span>
                <span>Projektwoche 2026</span>
            </div>
            <div class="add-project-link">
                <button id="btn-add-project" class="action-btn">
                    <i class="bi bi-plus-circle-fill"></i> Projekt hinzufügen
                </button>
            </div>
        </footer>
    </div>

    <!-- Add Project Modal -->
    <div class="modal-overlay" id="add-project-modal" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Neues Projekt verknüpfen</h2>
                <button class="close-modal" id="btn-close-modal" aria-label="Schließen">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <form id="add-project-form" class="modal-form">
                <div class="form-group">
                    <label for="new-project-name">Projektname</label>
                    <input type="text" id="new-project-name" required placeholder="z.B. Smart Home Control">
                </div>
                <div class="form-group">
                    <label for="new-project-url">URL / Adresse</label>
                    <input type="url" id="new-project-url" required placeholder="https://smarthome.deine-domain.de">
                </div>
                <div class="form-group">
                    <label for="new-project-desc">Beschreibung</label>
                    <textarea id="new-project-desc" rows="3" required placeholder="Kurze Beschreibung des Projekts und seiner Funktionen..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="new-project-category">Kategorie</label>
                        <select id="new-project-category">
                            <option value="Entwicklung">Entwicklung</option>
                            <option value="Infrastruktur">Infrastruktur</option>
                            <option value="Produktivität">Produktivität</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="new-project-icon">Icon</label>
                        <select id="new-project-icon">
                            <option value="bi-link-45deg">Standard-Link</option>
                            <option value="bi-cpu-fill">Server / CPU</option>
                            <option value="bi-hdd-network-fill">Netzwerk</option>
                            <option value="bi-code-slash">Code</option>
                            <option value="bi-house-fill">Home</option>
                            <option value="bi-lightbulb-fill">Smart-Device</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Hinzufügen</button>
            </form>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="login-modal" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Admin Login</h2>
                <button class="close-modal" id="btn-close-login" aria-label="Schließen">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <form id="login-form" class="modal-form">
                <div class="form-group">
                    <label for="login-username">Benutzername</label>
                    <input type="text" id="login-username" required placeholder="z.B. admin" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Passwort</label>
                    <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <div class="error-message" id="login-error" style="color: var(--danger); font-size: 0.85rem; display: none;"></div>
                <button type="submit" class="submit-btn">Anmelden</button>
            </form>
        </div>
    </div>

    <!-- Script File -->
    <script src="app.js"></script>
</body>
</html>
